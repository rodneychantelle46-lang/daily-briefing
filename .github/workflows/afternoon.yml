name: Afternoon Briefing

permissions:
  contents: read
  actions: write

# Keep scheduled and manual runs from racing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 12:07 PM CST (UTC+8) = 04:07 UTC.
    # Avoid GitHub Actions scheduled-run congestion around the top of the hour.
    - cron: '7 4 * * *'
  workflow_dispatch:  # 手动触发
    inputs:
      force_resend:
        description: "Force resend even if today's afternoon briefing was already marked sent"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      allow_degraded:
        description: "Manual override: send a clearly marked degraded afternoon briefing if LLM generation fails"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Generate and upload artifacts only; do not send Telegram or mark sent"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  afternoon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: daily-briefing-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            daily-briefing-data-${{ github.ref_name }}-

      - name: Guard late scheduled run
        id: schedule_guard
        shell: bash
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hhmm="$(TZ=Asia/Shanghai date +%H%M)"
            current=$((10#$hhmm))
            if (( current < 1200 || current >= 1215 )); then
              echo "Scheduled afternoon run started at ${hhmm} Asia/Shanghai, outside 12:00-12:14. OpenClaw owns fallback after 12:15; skipping this late schedule."
              skip=true
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12 for last30days sidecar
        if: steps.schedule_guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect last30days sidecar intelligence
        if: steps.schedule_guard.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LAST30DAYS_TIMEOUT_SECONDS: "60"
        shell: bash
        run: |
          python -m pip install PyYAML requests
          rm -rf .tmp/last30days-skill
          mkdir -p .tmp
          git clone --depth 1 https://github.com/mvanhorn/last30days-skill.git .tmp/last30days-skill
          LAST30DAYS_SKILL_DIR="$PWD/.tmp/last30days-skill" python tools/collect_last30days.py

      - name: Set up Python 3.11 for briefing
        if: steps.schedule_guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run afternoon briefing
        id: afternoon
        if: steps.schedule_guard.outputs.skip != 'true'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # Match morning hardening: afternoon also depends on multiple LLM calls.
          # Give transient backend slowness room to recover, then fail closed.
          CODEX_TIMEOUT: "90"
          CODEX_MAX_RETRIES: "2"
          CODEX_RETRY_DELAY: "8"
          OPENAI_TIMEOUT: "90"
          OPENAI_MAX_RETRIES: "2"
          OPENAI_RETRY_DELAY: "8"
          # Authenticate GitHub API deep reads; unauthenticated calls hit 60/h and degraded the GitHub section.
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          PYTHONIOENCODING: utf-8
          DAILY_BRIEFING_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_resend == 'true' && '1' || '' }}
          DAILY_BRIEFING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' && '1' || '' }}
          # The generator is a quality gate: fail closed instead of sending degraded picks.
          ALLOW_DEGRADED_AFTERNOON: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_degraded == 'true' && 'true' || 'false' }}
        run: python src/afternoon.py

      - name: Save runtime data cache
        if: success() && steps.schedule_guard.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        uses: actions/cache/save@v4
        with:
          path: data
          key: daily-briefing-data-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload briefing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-briefing-${{ github.run_id }}
          path: |
            artifacts/*.json
            data/*.json
          if-no-files-found: ignore

      - name: Notify afternoon failure
        if: always() && steps.afternoon.outcome == 'failure' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          BRIEFING_LABEL: "午报"
          BRIEFING_FAILURE_REASON: "Afternoon briefing GitHub Actions failed; artifacts were uploaded for audit."
          PYTHONIOENCODING: utf-8
        run: python -m src.notify_failure
