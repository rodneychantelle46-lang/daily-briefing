name: Afternoon Briefing

permissions:
  contents: read
  actions: write

# Keep scheduled and manual runs from racing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 12:00 PM CST (UTC+8) = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  afternoon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: daily-briefing-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            daily-briefing-data-${{ github.ref_name }}-

      - name: Run afternoon briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RECEIVE_ID: ${{ secrets.FEISHU_RECEIVE_ID }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python src/afternoon.py

      - name: Save runtime data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: daily-briefing-data-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload briefing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afternoon-briefing-${{ github.run_id }}
          path: |
            artifacts/*.json
            data/*.json
          if-no-files-found: ignore
