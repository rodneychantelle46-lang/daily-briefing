name: Morning Briefing

permissions:
  contents: read
  actions: write

# Keep scheduled and manual runs from racing each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 7:20 AM CST (UTC+8) = 23:20 UTC (previous day)
    - cron: '20 23 * * *'
  workflow_dispatch:  # 手动触发
    inputs:
      allow_degraded:
        description: "Manual override: send a clearly marked degraded morning briefing if LLM selection fails"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Generate and upload artifacts only; do not send Telegram or mark sent"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: daily-briefing-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            daily-briefing-data-${{ github.ref_name }}-

      - name: Guard late scheduled run
        id: schedule_guard
        shell: bash
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hhmm="$(TZ=Asia/Shanghai date +%H%M)"
            current=$((10#$hhmm))
            if (( current < 700 || current >= 735 )); then
              echo "Scheduled morning run started at ${hhmm} Asia/Shanghai, outside 07:00-07:34. OpenClaw owns fallback after 07:35; skipping this late schedule."
              skip=true
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Run morning briefing
        id: morning
        if: steps.schedule_guard.outputs.skip != 'true'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          # The selector is the quality gate. Give transient LLM slowness room
          # to recover, but still fail closed instead of sending degraded picks.
          CODEX_TIMEOUT: "90"
          CODEX_MAX_RETRIES: "2"
          CODEX_RETRY_DELAY: "8"
          OPENAI_TIMEOUT: "90"
          OPENAI_MAX_RETRIES: "2"
          OPENAI_RETRY_DELAY: "8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          PYTHONIOENCODING: utf-8
          # Scheduled delivery should send a clearly marked degraded version
          # instead of failing noisily when LLM providers are unavailable.
          DAILY_BRIEFING_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' && '1' || '' }}
          ALLOW_DEGRADED_MORNING: ${{ github.event_name == 'schedule' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.allow_degraded == 'true' && 'true' || 'false') }}
        run: python src/morning.py

      - name: Save runtime data cache
        if: success() && steps.schedule_guard.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        uses: actions/cache/save@v4
        with:
          path: data
          key: daily-briefing-data-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload briefing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-briefing-${{ github.run_id }}
          path: |
            artifacts/*.json
            data/*.json
          if-no-files-found: ignore

      - name: Notify morning failure
        if: always() && steps.morning.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          BRIEFING_LABEL: "晨报"
          BRIEFING_FAILURE_REASON: "Morning briefing GitHub Actions failed; artifacts were uploaded for audit."
          PYTHONIOENCODING: utf-8
        run: python -m src.notify_failure
